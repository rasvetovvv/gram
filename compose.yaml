name: gram

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gram
      POSTGRES_USER: gram
      POSTGRES_PASSWORD: gram
    volumes:
      - gram_postgres:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gram -d gram"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://gram:gram@postgres:5432/gram
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-gram-secret}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ENABLE_INTERNAL_LEDGER_TOPUPS: ${ENABLE_INTERNAL_LEDGER_TOPUPS:-true}
      AUTO_SEED: ${AUTO_SEED:-false}
      # 3000 is the built web container; 3100 is `npm run dev` for local iteration.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3100}
      MEDIA_ROOT: /app/media
    volumes:
      - gram_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # The browser reaches the api through the published port; Next's own /media proxy runs
      # inside the network and has to use the service name.
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  gram_postgres:
  gram_media:
