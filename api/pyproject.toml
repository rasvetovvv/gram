[project]
name = "gram-api"
version = "0.2.0"
description = "FastAPI backend for GRAM accounts, social graph, Stars, and collectibles"
requires-python = ">=3.14"
dependencies = [
  "asyncpg>=0.30.0,<1",
  "fastapi>=0.116.1,<1",
  # Runtime, not just tests: `app.nowpayments` prices crypto top-ups against a live provider,
  # and `app.main` imports it on startup — the image cannot boot without it.
  "httpx>=0.28.1,<1",
  "msgpack>=1.1,<2",
  "pillow>=11.3,<13",
  "pwdlib[argon2]>=0.3,<1",
  "pydantic>=2.11.7,<3",
  "pyjwt>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0,<1",
  "pytest>=8.4.1,<10",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.1,<8",
  "ruff>=0.12.8,<1",
  "ty>=0.0.1a16",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = ["-q", "--cov=app", "--cov-report=term-missing"]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "CPY001",
  "D",
  "EM101",
  "INP001",
  "ISC001",
  "PLC0415",
  "RUF001",
  "TC001",
  "TC002",
  "TC003",
  "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
# One-off import scripts report progress on stdout and raise ad-hoc errors by design.
"tools/**" = ["T201", "EM102"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.terminal]
error-on-warning = true
